name: Documentación

# Valida la documentación Markdown en cada PR y push a las ramas principales.
on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/docs.yml"
      - ".markdownlint.json"
  push:
    branches: [develop, main]
    paths:
      - "**/*.md"

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

  linkcheck:
    name: Link checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar enlaces
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--no-progress --include-fragments './**/*.md'"
          fail: true
