# Sistema de labels (fuente de verdad versionada). Criterio de uso: CLAUDE.md → "Labels".
# Cada issue lleva uno de cada grupo; los grupos se distinguen por color.

# Prioridad (rojo → amarillo)
- { name: "P0", color: "b60205", description: "Hacer ya: bloquea a otros o tiene plazo externo" }
- { name: "P1", color: "d93f0b", description: "Siguiente en la cola" }
- { name: "P2", color: "fbca04", description: "Necesario, puede esperar" }
- { name: "P3", color: "fef2c0", description: "Opcional" }

# Estado
- { name: "listo", color: "2ea44f", description: "Se puede empezar" }
- { name: "bloqueado", color: "6e7781", description: "Depende de otro issue abierto" }
- { name: "esperando", color: "8250df", description: "Pendiente de respuesta externa" }

# Esfuerzo (azules; referencia ~10 h/semana)
- { name: "S", color: "c5def5", description: "≈2 h" }
- { name: "M", color: "79b8ff", description: "≈10 h (una semana)" }
- { name: "L", color: "0366d6", description: ">10 h" }
